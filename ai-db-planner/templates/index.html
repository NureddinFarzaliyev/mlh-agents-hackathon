<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI DB Planner</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script></head><body><main>
<header><div class="eyebrow">MULTI-AGENT WORKBENCH</div><h1>AI DB Planner</h1><p>Turn a product idea into reviewed database architecture.</p></header>
<section class="card"><label for="topic">What are you building?</label><textarea id="topic" placeholder="e.g. E-Commerce Bookshop Application"></textarea><button id="start">Run planning pipeline <span>→</span></button><div id="error" class="error"></div></section>
<section id="pipeline" class="card hidden"><div class="section-title"><h2>Pipeline</h2><span id="status">Ready</span></div><div id="steps"></div></section>
<section id="questions" class="card hidden"><h2>A few decisions needed</h2><form id="answers"></form><button id="continue">Continue planning <span>→</span></button></section>
<section id="result" class="hidden"><div class="grid"><div class="card"><div class="section-title"><h2>Business requirements</h2><span class="badge">DECIDED</span></div><pre id="requirements"></pre></div><div class="card"><div class="section-title"><h2>Database plan</h2><span class="badge">REVIEWED</span></div><pre id="plan"></pre></div></div><div class="card"><div class="section-title"><h2>Schema diagram</h2><span class="badge">MERMAID</span></div><div id="diagram"></div></div></section>
</main><script src="/static/app.js"></script></body></html>
